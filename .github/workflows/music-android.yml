name: Build DJ SEBAS MIX STUDIO APK

on:
  workflow_dispatch:
  push:
    branches:
      - dj-sebas-ai-music
    paths:
      - "music/**"
      - ".github/workflows/music-android.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Sync app assets
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJ-SEBAS-MIX-STUDIO-APK
          path: music/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish public APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dj-sebas-mix-studio-v1.0.${{ github.run_number }}
          name: DJ SEBAS MIX STUDIO v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: music/android/app/build/outputs/apk/debug/app-debug.apk
